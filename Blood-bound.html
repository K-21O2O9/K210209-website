<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLOODBOUND - Vertical Slice</title>
    <!-- Tailwind for rapid UI layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Floating HP Bars */
        #hp-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .hp-bar { position: absolute; transform: translate(-50%, -100%); background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: bold; color: white; transition: top 0.1s, left 0.1s; }
        .hp-fill { height: 4px; background: #e11d48; border-radius: 2px; margin-top: 2px; transition: width 0.3s; }
        
        /* Dice animations */
        @keyframes roll { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        .rolling { animation: roll 0.5s ease-out; }
        .die-btn { transition: all 0.2s; }
        .die-btn.selected { box-shadow: 0 0 15px #facc15; border-color: #facc15; transform: translateY(-5px); }
        .die-btn.used { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }

        /* Notification Toast */
        #toast { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); border: 1px solid #c2410c; padding: 15px 30px; border-radius: 8px; font-size: 20px; font-weight: bold; text-align: center; opacity: 0; transition: opacity 0.3s; text-transform: uppercase; letter-spacing: 2px; z-index: 50;}
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Floating UI for Units -->
    <div id="hp-container"></div>

    <!-- Main UI -->
    <div id="ui-layer">
        <!-- Top Bar: Turn & AP -->
        <div class="w-full p-4 flex justify-between items-start bg-gradient-to-b from-black/80 to-transparent">
            <div class="pointer-events-auto">
                <h1 class="text-2xl font-bold tracking-widest text-gray-200 uppercase" style="font-family: serif;">Bloodbound</h1>
                <div id="turn-indicator" class="text-sm text-yellow-500 font-bold tracking-wide mt-1">PLAYER TURN</div>
            </div>
            <div class="flex flex-col items-end">
                <div class="text-sm text-gray-400">ACTION POINTS</div>
                <div class="flex space-x-1 mt-1" id="ap-container">
                    <div class="w-4 h-4 bg-yellow-400 rounded-full shadow-[0_0_10px_#facc15]"></div>
                    <div class="w-4 h-4 bg-yellow-400 rounded-full shadow-[0_0_10px_#facc15]"></div>
                    <div class="w-4 h-4 bg-yellow-400 rounded-full shadow-[0_0_10px_#facc15]"></div>
                </div>
            </div>
        </div>

        <!-- Center Message -->
        <div id="toast">Your Turn</div>

        <!-- Bottom Bar: Tactical Dice & Controls -->
        <div class="w-full p-4 bg-gradient-to-t from-black via-black/90 to-transparent pointer-events-auto">
            
            <div id="unit-info" class="mb-4 hidden text-center">
                <h2 id="unit-name" class="text-lg font-bold text-gray-200">Vanguard</h2>
                <p id="unit-desc" class="text-xs text-gray-400">Select a die to perform an action.</p>
            </div>

            <div class="flex justify-center space-x-4 mb-4" id="dice-container">
                <!-- Dice generated via JS -->
            </div>

            <div class="flex justify-between w-full">
                <button id="btn-end-turn" class="bg-red-900/80 hover:bg-red-800 text-white font-bold py-3 px-6 rounded border border-red-700 shadow-lg uppercase tracking-wider text-sm w-full">
                    End Turn
                </button>
            </div>
        </div>
    </div>

<script>
    /** --- SYSTEM & UTILS --- **/
    const DICE_FACES = [
        { id: 'move', icon: '👟', name: 'MOVE' },
        { id: 'attack', icon: '⚔️', name: 'ATTACK' },
        { id: 'magic', icon: '✨', name: 'MAGIC' },
        { id: 'dash', icon: '💨', name: 'DASH' },
        { id: 'defend', icon: '🛡️', name: 'DEFEND' },
        { id: 'wild', icon: '🃏', name: 'WILD' }
    ];

    // Simple Custom Tweening Engine
    const Tweens = [];
    function tween(obj, props, duration, easing = (t)=>t, onUpdate = null, onComplete = null) {
        const startProps = {};
        for (let k in props) startProps[k] = obj[k];
        Tweens.push({ obj, startProps, targetProps: props, duration, elapsed: 0, easing, onUpdate, onComplete });
    }
    function updateTweens(dt) {
        for (let i = Tweens.length - 1; i >= 0; i--) {
            let t = Tweens[i];
            t.elapsed += dt;
            let progress = Math.min(t.elapsed / t.duration, 1);
            let e = t.easing(progress);
            for (let k in t.targetProps) {
                t.obj[k] = t.startProps[k] + (t.targetProps[k] - t.startProps[k]) * e;
            }
            if (t.onUpdate) t.onUpdate();
            if (progress >= 1) {
                if (t.onComplete) t.onComplete();
                Tweens.splice(i, 1);
            }
        }
    }
    const Easing = {
        OutQuad: t => t * (2 - t),
        InQuad: t => t * t,
        OutElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1
    };

    /** --- 3D ENGINE SETUP --- **/
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.Fog(0x050508, 10, 25);

    // Portrait Tactical Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    let cameraShake = { x: 0, y: 0, z: 0, intensity: 0 };
    const baseCamPos = new THREE.Vector3(3.5, 12, 11);
    const baseCamLook = new THREE.Vector3(3.5, 0, 3.5);
    camera.position.copy(baseCamPos);
    camera.lookAt(baseCamLook);

    // Lighting (Premium feel)
    const ambientLight = new THREE.AmbientLight(0x202030, 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 2.5);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -5;
    dirLight.shadow.camera.right = 12;
    dirLight.shadow.camera.top = 12;
    dirLight.shadow.camera.bottom = -5;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Particle System Manager (Blood, Sparks)
    class ParticleSystem {
        constructor() {
            this.particles = [];
            const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            this.meshTemplate = new THREE.Mesh(geo, mat);
        }
        spawnBurst(pos, colorHex, count, speed = 1) {
            for(let i=0; i<count; i++) {
                const p = this.meshTemplate.clone();
                p.material = p.material.clone();
                p.material.color.setHex(colorHex);
                p.position.copy(pos);
                // Random velocity hemisphere upwards
                const vx = (Math.random() - 0.5) * speed;
                const vy = (Math.random() * 0.5 + 0.5) * speed;
                const vz = (Math.random() - 0.5) * speed;
                scene.add(p);
                this.particles.push({ mesh: p, vel: new THREE.Vector3(vx, vy, vz), life: 1.0 });
            }
        }
        update(dt) {
            for(let i = this.particles.length-1; i>=0; i--) {
                let p = this.particles[i];
                p.life -= dt * 2;
                p.vel.y -= dt * 3; // gravity
                p.mesh.position.addScaledVector(p.vel, dt);
                p.mesh.scale.setScalar(p.life);
                if(p.life <= 0) {
                    scene.remove(p.mesh);
                    this.particles.splice(i, 1);
                }
            }
        }
    }
    const vfx = new ParticleSystem();

    function triggerShake(intensity) {
        cameraShake.intensity = intensity;
    }

    /** --- GAMEPLAY LOGIC & BOARD --- **/
    const BOARD_SIZE = 8;
    const tiles = [];
    const tileMeshes = [];
    let units = [];

    // Materials
    const matTileDark = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.9, metalness: 0.1 });
    const matTileLight = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.9, metalness: 0.1 });
    const matTileHighlight = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5, transparent: true, opacity: 0.5 });
    const matTileAttack = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5, transparent: true, opacity: 0.5 });

    // Build Board
    const boardGroup = new THREE.Group();
    const tileGeo = new THREE.BoxGeometry(0.96, 0.2, 0.96);
    for (let x = 0; x < BOARD_SIZE; x++) {
        tiles[x] = [];
        for (let z = 0; z < BOARD_SIZE; z++) {
            const isLight = (x + z) % 2 === 0;
            const mesh = new THREE.Mesh(tileGeo, isLight ? matTileLight : matTileDark);
            mesh.position.set(x, 0, z);
            mesh.receiveShadow = true;
            mesh.userData = { x, z, originalMat: mesh.material };
            boardGroup.add(mesh);
            tiles[x][z] = { mesh, unit: null, type: 'normal' };
            tileMeshes.push(mesh);
        }
    }
    scene.add(boardGroup);

    // Add Central Relic for aesthetic
    const relicGeo = new THREE.CylinderGeometry(0.3, 0.5, 1, 8);
    const relicMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.2 });
    const relic = new THREE.Mesh(relicGeo, relicMat);
    relic.position.set(3.5, 0.5, 3.5);
    relic.castShadow = true;
    boardGroup.add(relic);
    const relicLight = new THREE.PointLight(0x00ffff, 1, 3);
    relicLight.position.set(3.5, 1.5, 3.5);
    scene.add(relicLight);


    // Unit Definitions
    class Unit {
        constructor(config, x, z) {
            this.id = Math.random().toString(36).substr(2, 9);
            this.name = config.name;
            this.team = config.team; // 'player' or 'enemy'
            this.maxHp = config.hp;
            this.hp = config.hp;
            this.atk = config.atk;
            this.moveRange = config.moveRange;
            this.atkRange = config.atkRange;
            this.x = x;
            this.z = z;
            this.hasActed = false;

            // Visuals
            this.mesh = this.buildMesh(config.visual);
            this.mesh.position.set(x, 0.2, z);
            scene.add(this.mesh);
            
            // HP UI
            this.uiEl = document.createElement('div');
            this.uiEl.className = 'hp-bar';
            this.uiEl.innerHTML = `<div>${this.name}</div><div class="hp-fill" style="width:100%"></div>`;
            document.getElementById('hp-container').appendChild(this.uiEl);

            tiles[x][z].unit = this;
            this.updateUIPosition();
        }

        buildMesh(vis) {
            const group = new THREE.Group();
            let geo;
            if (vis.shape === 'box') geo = new THREE.BoxGeometry(0.6, 1.2, 0.6);
            else if (vis.shape === 'cylinder') geo = new THREE.CylinderGeometry(0.3, 0.3, 1.2, 16);
            else geo = new THREE.ConeGeometry(0.4, 1.2, 8);
            
            // Main body
            const mat = new THREE.MeshStandardMaterial({ color: vis.color, roughness: 0.4, metalness: 0.6 });
            const body = new THREE.Mesh(geo, mat);
            body.position.y = 0.6;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Facing indicator
            const faceGeo = new THREE.BoxGeometry(0.2, 0.2, 0.4);
            const faceMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const face = new THREE.Mesh(faceGeo, faceMat);
            face.position.set(0, 0.9, 0.3);
            group.add(face);

            return group;
        }

        updateUIPosition() {
            // Project 3D pos to 2D screen
            const pos = this.mesh.position.clone();
            pos.y += 1.5;
            pos.project(camera);
            const x = (pos.x * .5 + .5) * window.innerWidth;
            const y = (pos.y * -.5 + .5) * window.innerHeight;
            this.uiEl.style.left = `${x}px`;
            this.uiEl.style.top = `${y}px`;
        }

        takeDamage(amount) {
            this.hp = Math.max(0, this.hp - amount);
            this.uiEl.querySelector('.hp-fill').style.width = `${(this.hp / this.maxHp) * 100}%`;
            
            // Blood VFX
            vfx.spawnBurst(this.mesh.position.clone().add(new THREE.Vector3(0, 0.6, 0)), 0xe11d48, 20, 3);
            triggerShake(0.2);

            // Flash red
            const bodyMat = this.mesh.children[0].material;
            const ogColor = bodyMat.color.getHex();
            bodyMat.color.setHex(0xff0000);
            setTimeout(() => { if(this.hp>0) bodyMat.color.setHex(ogColor); }, 150);

            if (this.hp <= 0) this.die();
        }

        die() {
            vfx.spawnBurst(this.mesh.position.clone().add(new THREE.Vector3(0, 0.6, 0)), 0xff0000, 50, 5);
            scene.remove(this.mesh);
            this.uiEl.remove();
            tiles[this.x][this.z].unit = null;
            units = units.filter(u => u !== this);
            triggerShake(0.4);
            checkWinCondition();
        }

        lookAtTile(tx, tz) {
            this.mesh.lookAt(tx, this.mesh.position.y, tz);
        }
    }

    // Configs
    const UNIT_TYPES = {
        commander: { name: 'Commander', team: 'player', hp: 12, atk: 4, moveRange: 3, atkRange: 1, visual: { shape: 'box', color: 0xfacc15 } },
        vanguard: { name: 'Vanguard', team: 'player', hp: 15, atk: 3, moveRange: 2, atkRange: 1, visual: { shape: 'box', color: 0x3b82f6 } },
        assassin: { name: 'Assassin', team: 'player', hp: 8, atk: 5, moveRange: 4, atkRange: 1, visual: { shape: 'cylinder', color: 0x8b5cf6 } },
        archer: { name: 'Archer', team: 'player', hp: 8, atk: 3, moveRange: 3, atkRange: 4, visual: { shape: 'cone', color: 0x10b981 } },
        mage: { name: 'Mage', team: 'player', hp: 6, atk: 4, moveRange: 2, atkRange: 3, visual: { shape: 'cone', color: 0x0ea5e9 } },
        grunt: { name: 'Corrupt', team: 'enemy', hp: 6, atk: 2, moveRange: 3, atkRange: 1, visual: { shape: 'box', color: 0x991b1b } },
        brute: { name: 'Demon', team: 'enemy', hp: 12, atk: 4, moveRange: 2, atkRange: 1, visual: { shape: 'box', color: 0x7f1d1d } }
    };

    // Spawn Units
    units.push(new Unit(UNIT_TYPES.commander, 3, 7));
    units.push(new Unit(UNIT_TYPES.vanguard, 2, 6));
    units.push(new Unit(UNIT_TYPES.vanguard, 4, 6));
    units.push(new Unit(UNIT_TYPES.assassin, 1, 7));
    units.push(new Unit(UNIT_TYPES.archer, 5, 7));
    units.push(new Unit(UNIT_TYPES.mage, 4, 7));

    units.push(new Unit(UNIT_TYPES.brute, 3, 0));
    units.push(new Unit(UNIT_TYPES.brute, 4, 0));
    units.push(new Unit(UNIT_TYPES.grunt, 1, 1));
    units.push(new Unit(UNIT_TYPES.grunt, 6, 1));
    units.push(new Unit(UNIT_TYPES.grunt, 2, 2));


    /** --- GAME STATE & INPUT --- **/
    let state = 'PLAYER_TURN'; // PLAYER_TURN, ACTION_ANIMATING, ENEMY_TURN, GAME_OVER
    let ap = 3;
    let diceRolled = [];
    let selectedUnit = null;
    let selectedDieIndex = -1;
    let highlightMeshes = [];

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // UI Elements
    const toastEl = document.getElementById('toast');
    const apContainer = document.getElementById('ap-container');
    const diceContainer = document.getElementById('dice-container');
    const unitInfo = document.getElementById('unit-info');
    const btnEndTurn = document.getElementById('btn-end-turn');

    function showToast(msg, color = 'white') {
        toastEl.innerText = msg;
        toastEl.style.color = color;
        toastEl.style.opacity = 1;
        toastEl.style.transform = 'translate(-50%, -50%) scale(1.1)';
        setTimeout(() => {
            toastEl.style.opacity = 0;
            toastEl.style.transform = 'translate(-50%, -50%) scale(1)';
        }, 1500);
    }

    function updateAPUI() {
        apContainer.innerHTML = '';
        for(let i=0; i<3; i++) {
            if(i < ap) apContainer.innerHTML += `<div class="w-4 h-4 bg-yellow-400 rounded-full shadow-[0_0_10px_#facc15]"></div>`;
            else apContainer.innerHTML += `<div class="w-4 h-4 bg-gray-700 rounded-full"></div>`;
        }
    }

    function rollDice() {
        diceRolled = [];
        diceContainer.innerHTML = '';
        for(let i=0; i<3; i++) {
            const d = DICE_FACES[Math.floor(Math.random() * DICE_FACES.length)];
            diceRolled.push({ ...d, used: false });
            
            const btn = document.createElement('button');
            btn.className = `die-btn w-16 h-16 bg-gray-800 border-2 border-gray-600 rounded-xl flex flex-col items-center justify-center text-white rolling`;
            btn.innerHTML = `<span class="text-2xl">${d.icon}</span><span class="text-[10px] font-bold mt-1">${d.name}</span>`;
            btn.onclick = () => selectDie(i, btn);
            diceContainer.appendChild(btn);
            
            // Remove animation class after roll
            setTimeout(() => btn.classList.remove('rolling'), 500);
        }
    }

    function selectDie(index, btnEl) {
        if (state !== 'PLAYER_TURN' || diceRolled[index].used) return;
        if (!selectedUnit) { showToast('Select a hero first!', '#facc15'); return; }
        
        selectedDieIndex = index;
        Array.from(diceContainer.children).forEach(c => c.classList.remove('selected'));
        btnEl.classList.add('selected');
        
        const die = diceRolled[index];
        showValidTargets(die.id);
    }

    function clearHighlights() {
        tileMeshes.forEach(m => m.material = m.userData.originalMat);
        highlightMeshes = [];
    }

    function showValidTargets(actionType) {
        clearHighlights();
        if(!selectedUnit) return;
        
        const isMove = actionType === 'move' || actionType === 'dash' || actionType === 'wild';
        const isAttack = actionType === 'attack' || actionType === 'magic' || actionType === 'wild';
        
        for (let x = 0; x < BOARD_SIZE; x++) {
            for (let z = 0; z < BOARD_SIZE; z++) {
                const dist = Math.abs(x - selectedUnit.x) + Math.abs(z - selectedUnit.z);
                const tile = tiles[x][z];
                
                if (isMove && dist <= selectedUnit.moveRange && dist > 0 && !tile.unit) {
                    if (x===3 && z===3) continue; // Skip relic
                    tile.mesh.material = matTileHighlight;
                    highlightMeshes.push({x, z, type: 'move'});
                }
                if (isAttack && dist <= selectedUnit.atkRange && dist > 0 && tile.unit && tile.unit.team !== selectedUnit.team) {
                    tile.mesh.material = matTileAttack;
                    highlightMeshes.push({x, z, type: 'attack'});
                }
            }
        }
    }

    // Input Handling
    window.addEventListener('pointerdown', (e) => {
        if(state !== 'PLAYER_TURN') return;
        if(e.target.closest('#ui-layer') && !e.target.closest('#game-canvas')) return; // Ignore UI clicks

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        // Check units first
        const unitMeshes = units.map(u => u.mesh.children[0]);
        const unitIntersects = raycaster.intersectObjects(unitMeshes);
        
        if (unitIntersects.length > 0) {
            const clickedMesh = unitIntersects[0].object.parent;
            const unit = units.find(u => u.mesh === clickedMesh);
            
            // Check if clicking enemy for attack
            if (unit && unit.team === 'enemy' && selectedDieIndex !== -1) {
                 const hl = highlightMeshes.find(h => h.x === unit.x && h.z === unit.z && h.type === 'attack');
                 if(hl) { executeAction(hl); return; }
            }

            if (unit && unit.team === 'player') {
                selectedUnit = unit;
                unitInfo.classList.remove('hidden');
                document.getElementById('unit-name').innerText = unit.name;
                selectedDieIndex = -1; // Reset die
                Array.from(diceContainer.children).forEach(c => c.classList.remove('selected'));
                clearHighlights();
                
                // Pop animation
                tween(unit.mesh.scale, {y: 1.2}, 0.1, Easing.OutQuad, null, () => {
                    tween(unit.mesh.scale, {y: 1.0}, 0.1, Easing.InQuad);
                });
                return;
            }
        }

        // Check tiles
        const tileIntersects = raycaster.intersectObjects(tileMeshes);
        if (tileIntersects.length > 0) {
            const tileMesh = tileIntersects[0].object;
            const {x, z} = tileMesh.userData;
            
            const highlight = highlightMeshes.find(h => h.x === x && h.z === z);
            if (highlight && selectedDieIndex !== -1) {
                executeAction(highlight);
            } else {
                // Deselect
                selectedUnit = null;
                unitInfo.classList.add('hidden');
                clearHighlights();
                Array.from(diceContainer.children).forEach(c => c.classList.remove('selected'));
                selectedDieIndex = -1;
            }
        }
    });

    /** --- COMBAT ACTIONS & ANIMATIONS --- **/
    function executeAction(targetInfo) {
        state = 'ACTION_ANIMATING';
        clearHighlights();
        
        const {x, z, type} = targetInfo;
        const die = diceRolled[selectedDieIndex];
        
        // Consume Resources
        die.used = true;
        diceContainer.children[selectedDieIndex].classList.add('used');
        diceContainer.children[selectedDieIndex].classList.remove('selected');
        ap--;
        updateAPUI();

        selectedUnit.lookAtTile(x, z);

        if (type === 'move') {
            // Anticipation
            tween(selectedUnit.mesh.position, { y: 0.5 }, 0.1, Easing.OutQuad, null, () => {
                // Impact (Move)
                tiles[selectedUnit.x][selectedUnit.z].unit = null;
                selectedUnit.x = x;
                selectedUnit.z = z;
                tiles[x][z].unit = selectedUnit;
                
                let targetVec = new THREE.Vector3(x, 0.2, z);
                tween(selectedUnit.mesh.position, { x: x, z: z }, 0.2, Easing.OutQuad, () => selectedUnit.updateUIPosition(), () => {
                    // Recovery
                    tween(selectedUnit.mesh.position, { y: 0.2 }, 0.1, Easing.InQuad, null, finishAction);
                });
            });
        } 
        else if (type === 'attack') {
            const targetUnit = tiles[x][z].unit;
            const startPos = { x: selectedUnit.mesh.position.x, z: selectedUnit.mesh.position.z };
            
            // Anticipation (pull back slightly)
            let dir = new THREE.Vector3(selectedUnit.x - x, 0, selectedUnit.z - z).normalize();
            tween(selectedUnit.mesh.position, { x: startPos.x + dir.x*0.5, z: startPos.z + dir.z*0.5 }, 0.2, Easing.OutQuad, null, () => {
                
                // Strike
                let isRanged = selectedUnit.atkRange > 1;
                if(isRanged) {
                    // Projectile simulation (VFX)
                    vfx.spawnBurst(targetUnit.mesh.position, 0xffff00, 10, 5);
                    targetUnit.takeDamage(selectedUnit.atk);
                    setTimeout(finishAction, 300);
                } else {
                    // Melee dash in
                    tween(selectedUnit.mesh.position, { x: x + dir.x*0.5, z: z + dir.z*0.5 }, 0.1, Easing.InQuad, null, () => {
                        
                        // IMPACT!
                        targetUnit.takeDamage(selectedUnit.atk);
                        
                        // Vanguard specific: Knockback logic
                        if (selectedUnit.name === 'Vanguard' && targetUnit.hp > 0) {
                            let kx = x - dir.x;
                            let kz = z - dir.z;
                            kx = Math.round(kx); kz = Math.round(kz);
                            if (kx >= 0 && kx < BOARD_SIZE && kz >= 0 && kz < BOARD_SIZE && !tiles[kx][kz].unit && !(kx===3 && kz===3)) {
                                tiles[x][z].unit = null;
                                targetUnit.x = kx;
                                targetUnit.z = kz;
                                tiles[kx][kz].unit = targetUnit;
                                tween(targetUnit.mesh.position, {x: kx, z: kz}, 0.2, Easing.OutQuad, () => targetUnit.updateUIPosition());
                            }
                        }

                        // Recovery
                        tween(selectedUnit.mesh.position, { x: startPos.x, z: startPos.z }, 0.3, Easing.OutElastic, null, finishAction);
                    });
                }
            });
        }
    }

    function finishAction() {
        if(checkWinCondition()) return;
        
        if (ap <= 0 || diceRolled.every(d => d.used)) {
            startEnemyTurn();
        } else {
            state = 'PLAYER_TURN';
            selectedDieIndex = -1;
            Array.from(diceContainer.children).forEach(c => c.classList.remove('selected'));
        }
    }

    /** --- ENEMY AI --- **/
    btnEndTurn.addEventListener('click', () => {
        if(state === 'PLAYER_TURN') startEnemyTurn();
    });

    function startEnemyTurn() {
        state = 'ENEMY_TURN';
        document.getElementById('turn-indicator').innerText = 'ENEMY TURN';
        document.getElementById('turn-indicator').classList.replace('text-yellow-500', 'text-red-500');
        showToast('Enemy Turn', '#ef4444');
        
        clearHighlights();
        selectedUnit = null;
        unitInfo.classList.add('hidden');
        diceContainer.innerHTML = '';
        apContainer.innerHTML = '';
        
        let enemies = units.filter(u => u.team === 'enemy');
        let index = 0;

        function nextEnemy() {
            if(index >= enemies.length || state === 'GAME_OVER') {
                startPlayerTurn();
                return;
            }
            processEnemyAI(enemies[index], () => {
                index++;
                setTimeout(nextEnemy, 300);
            });
        }
        
        setTimeout(nextEnemy, 1000);
    }

    function processEnemyAI(enemy, callback) {
        if(enemy.hp <= 0) { callback(); return; } // Dead during turn
        
        // Find closest player
        let players = units.filter(u => u.team === 'player');
        if(players.length === 0) { callback(); return; }
        
        let target = players[0];
        let minDist = 999;
        players.forEach(p => {
            let d = Math.abs(p.x - enemy.x) + Math.abs(p.z - enemy.z);
            if(d < minDist) { minDist = d; target = p; }
        });

        enemy.lookAtTile(target.x, target.z);

        // If in attack range, attack
        if(minDist <= enemy.atkRange) {
            enemyAttack(enemy, target, callback);
        } else {
            // Move towards
            let dx = Math.sign(target.x - enemy.x);
            let dz = Math.sign(target.z - enemy.z);
            
            // Try moving X first, then Z
            let nx = enemy.x + dx;
            let nz = enemy.z;
            
            if ((dx===0 || tiles[nx][nz].unit || (nx===3&&nz===3)) && dz !== 0) {
                nx = enemy.x;
                nz = enemy.z + dz;
            }
            
            if (nx >= 0 && nx < BOARD_SIZE && nz >= 0 && nz < BOARD_SIZE && !tiles[nx][nz].unit && !(nx===3&&nz===3)) {
                // Animate move
                tiles[enemy.x][enemy.z].unit = null;
                enemy.x = nx;
                enemy.z = nz;
                tiles[nx][nz].unit = enemy;
                
                tween(enemy.mesh.position, {y: 0.5}, 0.1, Easing.OutQuad, null, () => {
                    tween(enemy.mesh.position, {x: nx, z: nz}, 0.2, Easing.OutQuad, () => enemy.updateUIPosition(), () => {
                        tween(enemy.mesh.position, {y: 0.2}, 0.1, Easing.InQuad, null, () => {
                            // Check attack after move
                            minDist = Math.abs(target.x - enemy.x) + Math.abs(target.z - enemy.z);
                            if(minDist <= enemy.atkRange) {
                                setTimeout(() => enemyAttack(enemy, target, callback), 200);
                            } else {
                                callback();
                            }
                        });
                    });
                });
            } else {
                callback(); // Blocked
            }
        }
    }

    function enemyAttack(enemy, target, callback) {
        let dir = new THREE.Vector3(enemy.x - target.x, 0, enemy.z - target.z).normalize();
        let startPos = {x: enemy.mesh.position.x, z: enemy.mesh.position.z};
        
        tween(enemy.mesh.position, { x: startPos.x + dir.x*0.5, z: startPos.z + dir.z*0.5 }, 0.2, Easing.OutQuad, null, () => {
            tween(enemy.mesh.position, { x: target.x + dir.x*0.5, z: target.z + dir.z*0.5 }, 0.1, Easing.InQuad, null, () => {
                target.takeDamage(enemy.atk);
                tween(enemy.mesh.position, { x: startPos.x, z: startPos.z }, 0.3, Easing.OutElastic, null, callback);
            });
        });
    }

    function startPlayerTurn() {
        if(checkWinCondition()) return;
        state = 'PLAYER_TURN';
        ap = 3;
        document.getElementById('turn-indicator').innerText = 'PLAYER TURN';
        document.getElementById('turn-indicator').classList.replace('text-red-500', 'text-yellow-500');
        showToast('Your Turn', '#facc15');
        updateAPUI();
        rollDice();
    }

    function checkWinCondition() {
        if(state === 'GAME_OVER') return true;
        
        let p = units.filter(u => u.team === 'player');
        let e = units.filter(u => u.team === 'enemy');
        let comm = units.find(u => u.name === 'Commander');
        
        if (p.length === 0 || !comm) {
            state = 'GAME_OVER';
            showToast('DEFEAT. Commander fell.', '#ef4444');
            document.getElementById('ui-layer').style.pointerEvents = 'none';
            return true;
        }
        if (e.length === 0) {
            state = 'GAME_OVER';
            showToast('VICTORY!', '#10b981');
            document.getElementById('ui-layer').style.pointerEvents = 'none';
            return true;
        }
        return false;
    }


    /** --- MAIN LOOP --- **/
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        let dt = clock.getDelta();

        updateTweens(dt);
        vfx.update(dt);
        
        // Relic hover animation
        relic.position.y = 0.5 + Math.sin(clock.elapsedTime * 2) * 0.1;

        // Sync HP UI
        units.forEach(u => u.updateUIPosition());

        // Camera Shake application
        if (cameraShake.intensity > 0) {
            camera.position.x = baseCamPos.x + (Math.random() - 0.5) * cameraShake.intensity;
            camera.position.y = baseCamPos.y + (Math.random() - 0.5) * cameraShake.intensity;
            camera.position.z = baseCamPos.z + (Math.random() - 0.5) * cameraShake.intensity;
            cameraShake.intensity -= dt * 2;
            if(cameraShake.intensity < 0) cameraShake.intensity = 0;
        } else {
            camera.position.copy(baseCamPos);
        }

        renderer.render(scene, camera);
    }

    // Resize handler
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start Game
    startPlayerTurn();
    animate();

</script>
</body>
