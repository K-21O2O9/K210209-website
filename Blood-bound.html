<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLOODBOUND - Vertical Slice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --grid-color: #1a1c23;
            --grid-border: #2a2d36;
            --accent-gold: #c5a059;
            --accent-red: #8b0000;
            --player-color: #3b82f6;
            --enemy-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
        }

        /* Portrait Container constraints */
        #game-container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #1f222b 0%, #0f1115 100%);
            position: relative;
        }

        /* 8x8 Grid */
        #battlefield {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
            width: 96%;
            margin: 0 auto;
            border: 2px solid var(--grid-border);
            background-color: var(--grid-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            perspective: 1000px;
        }

        .tile {
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        .tile.move-range { background-color: rgba(59, 130, 246, 0.2); cursor: pointer; }
        .tile.attack-range { background-color: rgba(239, 68, 68, 0.2); cursor: crosshair; }
        .tile.selected { background-color: rgba(197, 160, 89, 0.3); border: 2px solid var(--accent-gold); }

        /* Blood Decals */
        .blood-pool {
            position: absolute;
            width: 80%;
            height: 80%;
            background-color: var(--accent-red);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            opacity: 0.6;
            transform: scale(0);
            animation: bloodSpread 0.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            pointer-events: none;
        }

        /* Units */
        .unit {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
        }
        
        .unit.player { background: linear-gradient(135deg, #1d4ed8, #1e3a8a); border: 2px solid #60a5fa; }
        .unit.enemy { background: linear-gradient(135deg, #b91c1c, #7f1d1d); border: 2px solid #f87171; }
        .unit.commander { border-width: 3px; border-color: var(--accent-gold); }
        .unit.dead { filter: grayscale(100%) opacity(0.5); transform: scale(0.8) rotate(90deg); z-index: 5;}

        /* HP Bars */
        .hp-bar-container {
            position: absolute;
            bottom: -8px;
            width: 100%;
            height: 4px;
            background-color: #000;
            border-radius: 2px;
            overflow: hidden;
        }
        .hp-bar-fill {
            height: 100%;
            background-color: #22c55e;
            transition: width 0.3s, background-color 0.3s;
        }
        
        /* Icons */
        .unit-icon { width: 60%; height: 60%; fill: white; }

        /* Dice */
        .dice-slot {
            width: 40px;
            height: 40px;
            background: #2a2d36;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            border: 2px solid #3f4451;
            transition: all 0.2s;
        }
        .dice-slot.used { opacity: 0.2; transform: scale(0.9); }
        .dice-slot.active { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(197, 160, 89, 0.5); }

        /* Animations for Cinematic Combat */
        @keyframes shake {
            0%, 100% { transform: translateX(0) translateY(0); }
            20% { transform: translateX(-5px) translateY(3px); }
            40% { transform: translateX(4px) translateY(-4px); }
            60% { transform: translateX(-3px) translateY(2px); }
            80% { transform: translateX(2px) translateY(-1px); }
        }
        .shake-active { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes hitStop {
            0% { filter: brightness(1) contrast(1); }
            50% { filter: brightness(1.5) contrast(1.2); }
            100% { filter: brightness(1) contrast(1); }
        }
        .hit-stop-active { animation: hitStop 0.2s ease-in-out; }

        @keyframes bump {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(var(--bump-x), var(--bump-y)) scale(1.1); z-index: 20; }
            100% { transform: translate(0, 0) scale(1); }
        }
        
        @keyframes bloodSpread {
            0% { transform: scale(0) rotate(0deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(45deg); opacity: 0.6; }
        }

        .damage-text {
            position: absolute;
            color: #ff4444;
            font-weight: bold;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 30;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.5); }
        }

        /* Fate Meter */
        .fate-pip {
            width: 12px;
            height: 12px;
            background: #2a2d36;
            border-radius: 50%;
            margin-right: 4px;
            transition: all 0.3s;
        }
        .fate-pip.filled {
            background: var(--accent-gold);
            box-shadow: 0 0 8px var(--accent-gold);
        }

        #rewind-overlay {
            background: rgba(15, 17, 21, 0.9);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Top HUD: Enemy / Fate -->
    <div class="flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full border-2 border-red-500 bg-red-900 flex items-center justify-center">
                <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div>
                <h2 class="text-red-400 font-bold text-sm tracking-wider uppercase">Enemy Commander</h2>
                <div class="w-24 h-2 bg-gray-800 rounded mt-1">
                    <div id="enemy-boss-hp" class="h-full bg-red-500 w-full transition-all duration-300"></div>
                </div>
            </div>
        </div>
        
        <div class="flex flex-col items-end">
            <h3 class="text-xs text-gray-400 font-bold tracking-widest mb-1 uppercase">Fate Chain</h3>
            <div class="flex" id="fate-meter">
                <div class="fate-pip"></div><div class="fate-pip"></div><div class="fate-pip"></div><div class="fate-pip"></div><div class="fate-pip"></div>
            </div>
        </div>
    </div>

    <div class="text-center py-1">
        <span id="turn-indicator" class="text-blue-400 font-bold tracking-widest uppercase text-sm">Player Turn</span>
    </div>

    <!-- The Battlefield -->
    <div id="battlefield" class="flex-grow-0">
        <!-- Grid and units generated by JS -->
    </div>

    <!-- Bottom HUD: Controls & Dice -->
    <div class="mt-auto bg-gradient-to-t from-black to-gray-900/90 p-4 border-t border-gray-800 flex flex-col gap-4 z-10 rounded-t-2xl">
        
        <!-- Unit Info & AP -->
        <div class="flex justify-between items-center h-12">
            <div id="selected-info" class="flex items-center gap-3 hidden">
                <div id="selected-icon" class="w-10 h-10 rounded-full border-2 border-blue-500 bg-blue-900 flex items-center justify-center">
                    <!-- Icon injected here -->
                </div>
                <div>
                    <h3 id="selected-name" class="font-bold text-blue-300 text-sm uppercase">Vanguard</h3>
                    <div class="text-xs text-gray-400">HP: <span id="selected-hp">5/5</span> | AP: <span id="selected-ap" class="text-white font-bold">2</span></div>
                </div>
            </div>
            <div id="no-selection" class="text-gray-500 text-sm italic">
                Select a unit to command...
            </div>
            
            <div class="text-right">
                <div class="text-xs text-gray-400 font-bold uppercase mb-1">Global AP</div>
                <div id="global-ap" class="text-2xl font-black text-white">3</div>
            </div>
        </div>

        <!-- Tactical Dice -->
        <div class="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-gray-800">
            <div class="flex gap-2" id="dice-container">
                <!-- Dice generated by JS -->
                <div class="dice-slot">?</div>
                <div class="dice-slot">?</div>
                <div class="dice-slot">?</div>
            </div>
            <button id="btn-end-turn" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded border border-gray-600 transition-colors uppercase text-sm tracking-wide">
                End Turn
            </button>
        </div>
    </div>

    <!-- Rewind Overlay -->
    <div id="rewind-overlay" class="absolute inset-0 hidden flex-col items-center justify-center z-50">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2 uppercase tracking-widest">Fate Reached</h1>
        <p class="text-gray-300 mb-8 text-center max-w-[80%]">The chain of fate is full. You may rewind time to undo a critical mistake.</p>
        <div class="flex gap-4">
            <button id="btn-rewind" class="bg-gradient-to-r from-yellow-600 to-yellow-800 text-white font-bold py-3 px-8 rounded-lg shadow-lg border border-yellow-500 hover:scale-105 transition-transform">
                Rewind Last Action
            </button>
            <button id="btn-skip-rewind" class="bg-gray-800 text-gray-300 font-bold py-3 px-6 rounded-lg border border-gray-600 hover:bg-gray-700 transition-colors">
                Continue
            </button>
        </div>
    </div>
    
    <!-- Game Over Overlay -->
    <div id="game-over-overlay" class="absolute inset-0 hidden flex-col items-center justify-center z-50 bg-black/90">
        <h1 id="game-over-title" class="text-5xl font-black text-red-500 mb-4 uppercase tracking-widest">Defeat</h1>
        <p id="game-over-desc" class="text-gray-300 mb-8">The Commander has fallen.</p>
        <button onclick="location.reload()" class="bg-gray-800 text-white font-bold py-3 px-8 rounded-lg border border-gray-600 hover:bg-gray-700 transition-colors uppercase">
            Restart Battle
        </button>
    </div>
</div>

<script>
    /* --- SVGs for Classes --- */
    const ICONS = {
        Commander: '<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>', // Crown-like
        Vanguard: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>', // Shield
        Assassin: '<svg viewBox="0 0 24 24"><path d="M2 22h2l9-13-2-2-9 13v2zm20-14l-6-6-2 2 6 6 2-2z"/></svg>', // Dagger
        Archer: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6v12M8 12h8"/></svg>', // Bow-ish
        Mage: '<svg viewBox="0 0 24 24"><path d="M12 2L9 8h6l-3-6zm0 20l3-6H9l3 6zM2 12l6-3v6l-6-3zm20 0l-6 3V9l6 3z"/></svg>' // Staff/Crystal
    };

    const DICE_FACES = [
        { type: 'Move', icon: '🏃', color: '#4ade80' },
        { type: 'Attack', icon: '⚔️', color: '#f87171' },
        { type: 'Magic', icon: '✨', color: '#a78bfa' },
        { type: 'Dash', icon: '⚡', color: '#facc15' },
        { type: 'Defend', icon: '🛡️', color: '#94a3b8' },
        { type: 'Wild', icon: '🌟', color: '#c5a059' }
    ];

    /* --- GAME STATE --- */
    const State = {
        gridSize: 8,
        turn: 'player', // 'player' or 'enemy'
        ap: 3,
        dice: [],
        fate: 0,
        units: [],
        bloodDecals: [], // {x, y}
        selectedUnitId: null,
        history: [], // For Fate rewind
        isAnimating: false,
        gameOver: false
    };

    /* --- UNIT DEFINITIONS --- */
    class Unit {
        constructor(id, type, team, x, y, hp, maxHp, moveRange, atkRange, dmg) {
            this.id = id;
            this.type = type;
            this.team = team;
            this.x = x;
            this.y = y;
            this.hp = hp;
            this.maxHp = maxHp;
            this.moveRange = moveRange;
            this.atkRange = atkRange;
            this.dmg = dmg;
            this.hasActed = false; // Soft limit to encourage using multiple units
        }
    }

    // Initialize units
    function initUnits() {
        let id = 0;
        State.units = [
            // Player Team (Bottom)
            new Unit(id++, 'Commander', 'player', 3, 7, 10, 10, 2, 1, 3),
            new Unit(id++, 'Vanguard', 'player', 2, 6, 8, 8, 2, 1, 2),
            new Unit(id++, 'Vanguard', 'player', 4, 6, 8, 8, 2, 1, 2),
            new Unit(id++, 'Archer', 'player', 1, 7, 5, 5, 2, 3, 2),
            new Unit(id++, 'Mage', 'player', 5, 7, 5, 5, 2, 3, 3),
            new Unit(id++, 'Assassin', 'player', 6, 6, 4, 4, 3, 1, 4),
            
            // Enemy Team (Top)
            new Unit(id++, 'Commander', 'enemy', 4, 0, 10, 10, 2, 1, 3),
            new Unit(id++, 'Vanguard', 'enemy', 3, 1, 8, 8, 2, 1, 2),
            new Unit(id++, 'Vanguard', 'enemy', 5, 1, 8, 8, 2, 1, 2),
            new Unit(id++, 'Archer', 'enemy', 2, 0, 5, 5, 2, 3, 2),
            new Unit(id++, 'Mage', 'enemy', 6, 0, 5, 5, 2, 3, 3),
            new Unit(id++, 'Assassin', 'enemy', 1, 1, 4, 4, 3, 1, 4),
        ];
    }

    /* --- SYSTEM: RENDER --- */
    const boardEl = document.getElementById('battlefield');
    
    function renderBoard() {
        boardEl.innerHTML = '';
        
        // Draw grid + Blood
        for (let y = 0; y < State.gridSize; y++) {
            for (let x = 0; x < State.gridSize; x++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.x = x;
                tile.dataset.y = y;
                
                // Add blood if exists
                const bloodCount = State.bloodDecals.filter(b => b.x === x && b.y === y).length;
                if (bloodCount > 0) {
                    const pool = document.createElement('div');
                    pool.className = 'blood-pool';
                    // Slightly increase size based on count, max 1.2
                    pool.style.transform = `scale(${Math.min(1.2, 0.5 + bloodCount * 0.2)}) rotate(${bloodCount*45}deg)`;
                    pool.style.opacity = Math.min(0.9, 0.4 + bloodCount * 0.2);
                    tile.appendChild(pool);
                }

                tile.addEventListener('click', () => handleTileClick(x, y));
                boardEl.appendChild(tile);
            }
        }

        // Draw Units
        State.units.forEach(unit => {
            if (unit.hp <= 0 && unit.type === 'Commander') return; // Hide dead commander to end game faster

            const unitEl = document.createElement('div');
            unitEl.className = `unit ${unit.team} ${unit.type === 'Commander' ? 'commander' : ''} ${unit.hp <= 0 ? 'dead' : ''}`;
            
            // Position using percentages for fluidity
            unitEl.style.left = `${(unit.x / State.gridSize) * 100}%`;
            unitEl.style.top = `${(unit.y / State.gridSize) * 100}%`;
            unitEl.style.width = `${100 / State.gridSize}%`;
            unitEl.style.height = `${100 / State.gridSize}%`;
            
            // Icon
            unitEl.innerHTML = `<div class="unit-icon flex justify-center items-center">${ICONS[unit.type] || '♟️'}</div>`;
            
            // HP Bar (if alive)
            if (unit.hp > 0) {
                const hpContainer = document.createElement('div');
                hpContainer.className = 'hp-bar-container';
                const hpFill = document.createElement('div');
                hpFill.className = 'hp-bar-fill';
                hpFill.style.width = `${(unit.hp / unit.maxHp) * 100}%`;
                
                // Color change based on health
                if (unit.hp <= unit.maxHp * 0.3) hpFill.style.backgroundColor = '#ef4444'; // red
                else if (unit.hp <= unit.maxHp * 0.6) hpFill.style.backgroundColor = '#eab308'; // yellow
                
                hpContainer.appendChild(hpFill);
                unitEl.appendChild(hpContainer);
            }

            // Selection highlight
            if (State.selectedUnitId === unit.id) {
                unitEl.style.boxShadow = '0 0 15px var(--accent-gold)';
            }

            // Click handling directly on unit
            unitEl.addEventListener('click', (e) => {
                e.stopPropagation();
                if (unit.hp > 0) handleTileClick(unit.x, unit.y);
            });

            boardEl.appendChild(unitEl);
        });

        updateUI();
        highlightValidMoves();
    }

    function updateUI() {
        // Top HUD
        const enemyBoss = State.units.find(u => u.type === 'Commander' && u.team === 'enemy');
        if (enemyBoss) {
            document.getElementById('enemy-boss-hp').style.width = `${Math.max(0, (enemyBoss.hp / enemyBoss.maxHp) * 100)}%`;
        }

        // Fate
        const pips = document.querySelectorAll('.fate-pip');
        pips.forEach((pip, i) => {
            if (i < State.fate) pip.classList.add('filled');
            else pip.classList.remove('filled');
        });

        // Turn
        const turnInd = document.getElementById('turn-indicator');
        turnInd.innerText = State.turn === 'player' ? 'Player Turn' : 'Enemy Turn';
        turnInd.className = State.turn === 'player' ? 'text-blue-400 font-bold tracking-widest uppercase text-sm' : 'text-red-400 font-bold tracking-widest uppercase text-sm';

        // Bottom HUD - AP
        document.getElementById('global-ap').innerText = State.ap;

        // Bottom HUD - Dice
        const diceCont = document.getElementById('dice-container');
        diceCont.innerHTML = '';
        State.dice.forEach(d => {
            const dEl = document.createElement('div');
            dEl.className = `dice-slot ${d.used ? 'used' : 'active'}`;
            dEl.style.color = d.color;
            dEl.innerHTML = d.icon;
            diceCont.appendChild(dEl);
        });

        // Selected Unit Info
        const selUnit = getUnitById(State.selectedUnitId);
        if (selUnit) {
            document.getElementById('selected-info').classList.remove('hidden');
            document.getElementById('no-selection').classList.add('hidden');
            document.getElementById('selected-icon').innerHTML = `<svg class="w-6 h-6 fill-white" viewBox="0 0 24 24">${ICONS[selUnit.type]}</svg>`;
            document.getElementById('selected-icon').className = `w-10 h-10 rounded-full border-2 flex items-center justify-center ${selUnit.team === 'player' ? 'border-blue-500 bg-blue-900' : 'border-red-500 bg-red-900'}`;
            document.getElementById('selected-name').innerText = selUnit.type;
            document.getElementById('selected-name').className = `font-bold text-sm uppercase ${selUnit.team === 'player' ? 'text-blue-300' : 'text-red-400'}`;
            document.getElementById('selected-hp').innerText = `${selUnit.hp}/${selUnit.maxHp}`;
        } else {
            document.getElementById('selected-info').classList.add('hidden');
            document.getElementById('no-selection').classList.remove('hidden');
        }
    }

    /* --- HELPERS --- */
    const getUnitAt = (x, y) => State.units.find(u => u.x === x && u.y === y && u.hp > 0);
    const getUnitById = (id) => State.units.find(u => u.id === id);
    const distance = (x1, y1, x2, y2) => Math.abs(x1 - x2) + Math.abs(y1 - y2); // Manhattan distance

    function highlightValidMoves() {
        if (!State.selectedUnitId || State.turn !== 'player' || State.isAnimating) return;
        
        const unit = getUnitById(State.selectedUnitId);
        if (unit.team !== 'player') return;

        // Check if we have resources
        const hasAP = State.ap > 0;
        const hasMoveDie = State.dice.some(d => !d.used && (d.type === 'Move' || d.type === 'Dash' || d.type === 'Wild'));
        const hasAtkDie = State.dice.some(d => !d.used && (d.type === 'Attack' || d.type === 'Magic' || d.type === 'Wild'));

        const tiles = document.querySelectorAll('.tile');
        tiles.forEach(t => {
            const tx = parseInt(t.dataset.x);
            const ty = parseInt(t.dataset.y);
            t.classList.remove('move-range', 'attack-range', 'selected');
            
            if (tx === unit.x && ty === unit.y) {
                t.classList.add('selected');
                return;
            }

            const dist = distance(unit.x, unit.y, tx, ty);
            const targetUnit = getUnitAt(tx, ty);

            // Movement
            if (dist <= unit.moveRange && !targetUnit && hasAP && hasMoveDie) {
                t.classList.add('move-range');
            }
            // Attack
            else if (dist <= unit.atkRange && targetUnit && targetUnit.team !== unit.team && hasAP && hasAtkDie) {
                t.classList.add('attack-range');
            }
        });
    }

    /* --- INPUT HANDLING --- */
    function handleTileClick(x, y) {
        if (State.isAnimating || State.turn !== 'player' || State.gameOver) return;

        const clickedUnit = getUnitAt(x, y);
        const selectedUnit = getUnitById(State.selectedUnitId);

        // Select a unit
        if (clickedUnit && (!selectedUnit || clickedUnit.team === 'player' || distance(selectedUnit.x, selectedUnit.y, x, y) > selectedUnit.atkRange)) {
            State.selectedUnitId = clickedUnit.id;
            renderBoard();
            return;
        }

        // Action with selected unit
        if (selectedUnit && selectedUnit.team === 'player') {
            const dist = distance(selectedUnit.x, selectedUnit.y, x, y);
            
            // Move
            if (!clickedUnit && dist <= selectedUnit.moveRange) {
                attemptMove(selectedUnit, x, y);
            }
            // Attack
            else if (clickedUnit && clickedUnit.team === 'enemy' && dist <= selectedUnit.atkRange) {
                attemptAttack(selectedUnit, clickedUnit);
            } else {
                // Deselect if clicking out of bounds
                State.selectedUnitId = null;
                renderBoard();
            }
        }
    }

    /* --- GAME LOGIC --- */
    function saveState() {
        State.history.push(JSON.stringify({
            units: State.units,
            ap: State.ap,
            dice: State.dice,
            bloodDecals: State.bloodDecals,
            fate: State.fate
        }));
        if (State.history.length > 5) State.history.shift(); // Keep history manageable
    }

    function attemptMove(unit, x, y) {
        if (State.ap < 1) return;
        const dieIndex = State.dice.findIndex(d => !d.used && (d.type === 'Move' || d.type === 'Dash' || d.type === 'Wild'));
        if (dieIndex === -1) return;

        saveState(); // Save before action
        
        State.ap--;
        State.dice[dieIndex].used = true;
        
        unit.x = x;
        unit.y = y;
        unit.hasActed = true;
        
        // Play small move sound/effect here in real game
        renderBoard();
    }

    async function attemptAttack(attacker, target) {
        if (State.ap < 1) return;
        
        let validDiceTypes = ['Attack', 'Wild'];
        if (attacker.type === 'Mage') validDiceTypes.push('Magic');
        
        const dieIndex = State.dice.findIndex(d => !d.used && validDiceTypes.includes(d.type));
        if (dieIndex === -1 && attacker.team === 'player') return;

        saveState(); // Save before action

        if (attacker.team === 'player') {
            State.ap--;
            State.dice[dieIndex].used = true;
        }

        attacker.hasActed = true;
        State.isAnimating = true;

        // 1. Calculate direction for bump animation
        const dx = target.x - attacker.x;
        const dy = target.y - attacker.y;
        
        // Target visual elements
        renderBoard(); // refresh to ensure positions
        const attackerEls = document.querySelectorAll('.unit');
        let attackerEl, targetEl;
        attackerEls.forEach(el => {
            const bgStr = el.style.left;
            if(bgStr === `${(attacker.x/8)*100}%` && el.style.top === `${(attacker.y/8)*100}%`) attackerEl = el;
            if(bgStr === `${(target.x/8)*100}%` && el.style.top === `${(target.y/8)*100}%`) targetEl = el;
        });

        // 2. Play attack bump
        if (attackerEl) {
            attackerEl.style.setProperty('--bump-x', `${Math.sign(dx) * 20}%`);
            attackerEl.style.setProperty('--bump-y', `${Math.sign(dy) * 20}%`);
            attackerEl.style.animation = 'bump 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        }

        await new Promise(r => setTimeout(r, 150)); // Wait for bump peak

        // 3. Impact & Damage
        const damage = attacker.dmg + (Math.random() > 0.8 ? 1 : 0); // slight crit chance
        target.hp -= damage;

        // Cinematic FX: Screen shake & Hit stop
        const container = document.getElementById('game-container');
        container.classList.add('shake-active', 'hit-stop-active');
        
        // Blood Decal
        State.bloodDecals.push({x: target.x, y: target.y});
        
        // Floating Damage
        const dmgText = document.createElement('div');
        dmgText.className = 'damage-text';
        dmgText.innerText = `-${damage}`;
        if(targetEl) {
            targetEl.appendChild(dmgText);
        }

        await new Promise(r => setTimeout(r, 200)); // Hit stop duration
        container.classList.remove('shake-active', 'hit-stop-active');
        
        if (attackerEl) attackerEl.style.animation = ''; // remove bump

        // Fate System
        if (attacker.team === 'player') {
            State.fate++;
            if (State.fate >= 5) {
                renderBoard(); // Update visuals before pausing
                triggerFateChain();
                return; // Early exit, fate intercepts
            }
        }

        checkWinCondition();
        
        if(!State.gameOver) {
            State.isAnimating = false;
            renderBoard();
        }
    }

    function checkWinCondition() {
        const playerBoss = State.units.find(u => u.type === 'Commander' && u.team === 'player');
        const enemyBoss = State.units.find(u => u.type === 'Commander' && u.team === 'enemy');

        if (playerBoss.hp <= 0) {
            State.gameOver = true;
            document.getElementById('game-over-overlay').classList.remove('hidden');
            document.getElementById('game-over-overlay').classList.add('flex');
            document.getElementById('game-over-title').innerText = "Defeat";
            document.getElementById('game-over-title').className = "text-5xl font-black text-red-500 mb-4 uppercase tracking-widest";
            document.getElementById('game-over-desc').innerText = "Your Commander has fallen.";
        } else if (enemyBoss.hp <= 0) {
            State.gameOver = true;
            document.getElementById('game-over-overlay').classList.remove('hidden');
            document.getElementById('game-over-overlay').classList.add('flex');
            document.getElementById('game-over-title').innerText = "Victory";
            document.getElementById('game-over-title').className = "text-5xl font-black text-yellow-500 mb-4 uppercase tracking-widest";
            document.getElementById('game-over-desc').innerText = "The enemy Commander is dead.";
        }
    }

    /* --- FATE CHAIN (REWIND) --- */
    function triggerFateChain() {
        document.getElementById('rewind-overlay').classList.remove('hidden');
        document.getElementById('rewind-overlay').classList.add('flex');
        
        // Deepen cinematic pause
        document.getElementById('battlefield').style.filter = 'grayscale(50%) brightness(0.5)';
    }

    document.getElementById('btn-rewind').addEventListener('click', () => {
        if (State.history.length > 0) {
            const prevState = JSON.parse(State.history[State.history.length - 1]);
            State.units = prevState.units;
            State.ap = prevState.ap;
            State.dice = prevState.dice;
            State.bloodDecals = prevState.bloodDecals;
            State.fate = 0; // Reset fate
            State.history.pop();
        }
        
        closeFateOverlay();
    });

    document.getElementById('btn-skip-rewind').addEventListener('click', () => {
        State.fate = 0; // Consume fate, don't rewind
        closeFateOverlay();
    });

    function closeFateOverlay() {
        document.getElementById('rewind-overlay').classList.add('hidden');
        document.getElementById('rewind-overlay').classList.remove('flex');
        document.getElementById('battlefield').style.filter = '';
        State.isAnimating = false;
        renderBoard();
        checkWinCondition();
    }

    /* --- TURN MANAGEMENT & AI --- */
    function startTurn(team) {
        State.turn = team;
        State.ap = 3;
        State.selectedUnitId = null;
        State.units.forEach(u => u.hasActed = false);

        if (team === 'player') {
            // Roll 3 Tactical Dice
            State.dice = [];
            for(let i=0; i<3; i++) {
                const face = DICE_FACES[Math.floor(Math.random() * DICE_FACES.length)];
                State.dice.push({ ...face, used: false });
            }
        }

        renderBoard();

        if (team === 'enemy') {
            setTimeout(executeAITurn, 800);
        }
    }

    document.getElementById('btn-end-turn').addEventListener('click', () => {
        if (State.turn === 'player' && !State.isAnimating && !State.gameOver) {
            startTurn('enemy');
        }
    });

    async function executeAITurn() {
        // Vertical Slice AI: Simple Evaluation
        // Find units that can attack, otherwise move towards player commander.
        
        let aiAp = 3;
        const enemyUnits = State.units.filter(u => u.team === 'enemy' && u.hp > 0);
        const playerUnits = State.units.filter(u => u.team === 'player' && u.hp > 0);
        const playerCommander = playerUnits.find(u => u.type === 'Commander');

        for (let i = 0; i < aiAp; i++) {
            if (State.gameOver) break;

            // 1. Evaluate Kill/Attack Opportunity
            let actionTaken = false;
            
            for (let e of enemyUnits) {
                if (actionTaken) break;
                
                // Look for targets in range
                for (let p of playerUnits) {
                    if (distance(e.x, e.y, p.x, p.y) <= e.atkRange) {
                        await attemptAttack(e, p);
                        actionTaken = true;
                        break;
                    }
                }
            }

            // 2. Evaluate Movement if no attack was possible
            if (!actionTaken && playerCommander) {
                // Pick a random enemy unit that hasn't acted much
                const mobileEnemies = enemyUnits.filter(e => !e.hasActed);
                const mover = mobileEnemies.length > 0 ? mobileEnemies[0] : enemyUnits[0];
                
                if (mover) {
                    // Move 1 step towards player commander
                    const dx = Math.sign(playerCommander.x - mover.x);
                    const dy = Math.sign(playerCommander.y - mover.y);
                    
                    let newX = mover.x;
                    let newY = mover.y;

                    // Prefer moving in the direction with larger gap, avoiding overlaps
                    if (Math.abs(playerCommander.x - mover.x) > Math.abs(playerCommander.y - mover.y)) {
                        if (!getUnitAt(mover.x + dx, mover.y)) newX += dx;
                        else if (!getUnitAt(mover.x, mover.y + dy)) newY += dy;
                    } else {
                        if (!getUnitAt(mover.x, mover.y + dy)) newY += dy;
                        else if (!getUnitAt(mover.x + dx, mover.y)) newX += dx;
                    }

                    if (newX !== mover.x || newY !== mover.y) {
                        mover.x = newX;
                        mover.y = newY;
                        mover.hasActed = true;
                        renderBoard();
                        await new Promise(r => setTimeout(r, 400));
                    }
                }
            }
            
            await new Promise(r => setTimeout(r, 400)); // Pause between AI actions
        }

        if(!State.gameOver) startTurn('player');
    }

    /* --- INITIALIZATION --- */
    initUnits();
    startTurn('player');

</script>
